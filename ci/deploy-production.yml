name: deploy-production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: deploy exact staging artifact or rollback runtime only
        required: true
        type: choice
        options: [deploy, rollback]
      staging_run_id:
        description: successful deploy-staging run ID that produced the manifest
        required: true
        type: string
      runtime_image:
        description: exact runtime image@sha256 from staging manifest
        required: true
        type: string
      migration_image:
        description: exact migration image@sha256 from staging manifest
        required: true
        type: string
      rollback_runtime_image:
        description: previous runtime image@sha256, required only for rollback
        required: false
        type: string
      backup_restore_point_confirmed:
        description: confirm a fresh backup/restore point exists before a deploy
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Require backup confirmation for a forward deploy
        if: inputs.mode == 'deploy'
        run: '[[ "${{ inputs.backup_restore_point_confirmed }}" == "true" ]]'

      - name: Download the staging manifest
        if: inputs.mode == 'deploy'
        uses: actions/download-artifact@v4
        with:
          name: staging-release-manifest
          path: release
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact images passed staging
        if: inputs.mode == 'deploy'
        run: |
          jq -e --arg runtime '${{ inputs.runtime_image }}' --arg migrations '${{ inputs.migration_image }}' \
            '.runtimeImage == $runtime and .migrationImage == $migrations' release/release-manifest.json
          [[ '${{ inputs.runtime_image }}' == *@sha256:* ]]
          [[ '${{ inputs.migration_image }}' == *@sha256:* ]]

      - name: Validate rollback digest
        if: inputs.mode == 'rollback'
        run: '[[ "${{ inputs.rollback_runtime_image }}" == *@sha256:* ]]'

      - name: Migrate and deploy production
        if: inputs.mode == 'deploy'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_MIGRATION_SERVICE_ID: ${{ vars.RENDER_MIGRATION_SERVICE_ID }}
          RENDER_RUNTIME_SERVICE_ID: ${{ vars.RENDER_RUNTIME_SERVICE_ID }}
          MIGRATION_IMAGE: ${{ inputs.migration_image }}
          RUNTIME_IMAGE: ${{ inputs.runtime_image }}
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          RUN_MIGRATION: "true"
        run: bash deploy/scripts/render-deploy.sh

      - name: Roll back runtime digest without down migration
        if: inputs.mode == 'rollback'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_MIGRATION_SERVICE_ID: ${{ vars.RENDER_MIGRATION_SERVICE_ID }}
          RENDER_RUNTIME_SERVICE_ID: ${{ vars.RENDER_RUNTIME_SERVICE_ID }}
          RUNTIME_IMAGE: ${{ inputs.rollback_runtime_image }}
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          RUN_MIGRATION: "false"
        run: bash deploy/scripts/render-deploy.sh
