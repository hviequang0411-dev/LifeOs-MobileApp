name: LifeOS Mobile CI Gate

on:
  push:
    paths:
      - 'mobile/**'
      - 'docs/api/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'docs/api/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  analyze-test-and-build:
    name: Flutter Analyze, Unit/Golden/Contract Tests & Debug APK Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sqlite3 shared library for Linux test runner
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Setup Java 17 for Android Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify zero static analysis issues (flutter analyze)
        run: flutter analyze --no-pub

      - name: Run Unit, Contract Vectors, Widget, Golden, Accessibility & Performance Tests
        run: flutter test --no-pub --coverage

      - name: Build Android Debug APK
        run: flutter build apk --debug
