name: lifeos-observability

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    networks: [lifeos-observability]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    read_only: true
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:?Set GRAFANA_ROOT_URL}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/lifeos-backend.json:/var/lib/grafana/dashboards/lifeos-backend.json:ro
      - ./grafana/lifeos-operations.json:/var/lib/grafana/dashboards/lifeos-operations.json:ro
      - grafana-data:/var/lib/grafana
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    networks: [lifeos-observability]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    depends_on: [prometheus]

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/var/lib/node-exporter/textfile
    volumes:
      - lifeos-textfile-metrics:/var/lib/node-exporter/textfile:ro
    networks: [lifeos-observability]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m

volumes:
  prometheus-data:
  grafana-data:
  lifeos-textfile-metrics:
    name: lifeos-textfile-metrics

networks:
  lifeos-observability:
    external: true
