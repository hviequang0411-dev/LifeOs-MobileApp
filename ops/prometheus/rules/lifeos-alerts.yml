groups:
  - name: lifeos-core
    rules:
      - alert: LifeOSBackendMetricsTargetDown
        expr: up{job="lifeos-backend"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: LifeOS backend metrics target is down

      - alert: LifeOSHigh5xxRate
        expr: >-
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) > 0.01
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: LifeOS 5xx rate exceeds 1 percent

      - alert: LifeOSDatabasePoolPending
        expr: hikaricp_connections_pending > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: LifeOS database pool has pending requests

      - alert: LifeOSHeapHigh
        expr: >-
          sum(jvm_memory_used_bytes{area="heap"})
          / clamp_min(sum(jvm_memory_max_bytes{area="heap"}), 1) > 0.90
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: LifeOS JVM heap exceeds 90 percent

      - alert: LifeOSOutboxPermanentFailure
        expr: increase(lifeos_outbox_events_total{outcome="FAILED"}[15m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: LifeOS outbox recorded a permanent failure

      - alert: LifeOSReminderLag
        expr: >-
          histogram_quantile(0.95,
          sum by (le) (rate(lifeos_notification_reminder_lag_seconds_bucket[5m]))) > 90
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: LifeOS reminder p95 lag exceeds three scheduler cycles

      - alert: LifeOSSyncPushSlow
        expr: >-
          histogram_quantile(0.95,
          sum by (le) (rate(http_server_requests_seconds_bucket{uri="/api/v1/sync/push"}[5m]))) > 2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: LifeOS sync push p95 exceeds two seconds

      - alert: LifeOSConsistencyViolation
        expr: lifeos_sync_consistency_violations > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: LifeOS consistency check reported a violation

      - alert: LifeOSExportFailures
        expr: increase(lifeos_export_completed_total{result="failed"}[1h]) > 3
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: LifeOS export failures exceed the hourly threshold

      - alert: LifeOSBackupStale
        expr: time() - lifeos_backup_last_success_timestamp_seconds > 93600
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: LifeOS offsite logical backup is older than 26 hours

      - alert: LifeOSBackupMetricMissing
        expr: absent(lifeos_backup_last_success_timestamp_seconds)
        for: 30m
        labels: {severity: critical}
        annotations:
          summary: LifeOS backup success metric is missing

      - alert: LifeOSRestoreDrillOverdue
        expr: time() - lifeos_restore_last_success_timestamp_seconds > 3024000
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: LifeOS restore drill is older than 35 days

      - alert: LifeOSRestoreMetricMissing
        expr: absent(lifeos_restore_last_success_timestamp_seconds)
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: LifeOS restore drill metric is missing
