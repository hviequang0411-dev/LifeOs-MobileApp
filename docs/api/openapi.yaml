        requestLimit: {type: integer, format: int64, minimum: 0}
        requestsUsed: {type: integer, format: int64, minimum: 0}
        inputTokenLimit: {type: integer, format: int64, minimum: 0}
        inputTokensUsed: {type: integer, format: int64, minimum: 0}
        outputTokenLimit: {type: integer, format: int64, minimum: 0}
        outputTokensUsed: {type: integer, format: int64, minimum: 0}
        resetsAt: {type: string, format: date-time}
      required: [requestLimit, requestsUsed, inputTokenLimit, inputTokensUsed, outputTokenLimit, outputTokensUsed, resetsAt]
    AiLimitsResponse:
