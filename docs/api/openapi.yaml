components:
  schemas:
    # BEGIN AIP1 CONTRACT-FIRST AI SCHEMAS
    AiContextDomain:
      type: string
      enum: [TASK_CALENDAR, HABIT, GOAL, NOTES, FINANCE]
    AiGenerationMode:
      type: string
      enum: [CHAT, DAILY_PLAN, WEEKLY_PLAN, TASK_BREAKDOWN, HABIT_INSIGHT, FINANCE_INSIGHT, NOTE_SUMMARY]
    AiMessageRole:
      type: string
      enum: [USER, ASSISTANT]
    AiActionStatus:
      type: string
      enum: [PROPOSED, APPROVED, REJECTED, CANCELLED, EXPIRED, EXECUTING, EXECUTED, FAILED]
    AiActionType:
      type: string
      enum: [CREATE_TASK, UPDATE_TASK_PRIORITY, UPDATE_TASK_SCHEDULE]
    AiErrorCode:
      type: string
      enum: [AI_DISABLED, AI_CONSENT_REQUIRED, AI_CONTEXT_DOMAIN_NOT_ALLOWED, AI_CONVERSATION_NOT_FOUND, AI_MESSAGE_TOO_LARGE, AI_RATE_LIMITED, AI_QUOTA_EXCEEDED, AI_BUDGET_EXCEEDED, AI_PROVIDER_UNAVAILABLE, AI_RESPONSE_INVALID, AI_ACTION_NOT_FOUND, AI_ACTION_EXPIRED, AI_ACTION_STATE_CONFLICT, AI_ACTION_FORBIDDEN, AI_ACTION_VERSION_CONFLICT]
    AiFeatureFlags:
      type: object
      additionalProperties: false
      properties:
        chat: {type: boolean}
        insights: {type: boolean}
        notes: {type: boolean}
        finance: {type: boolean}
        rag: {type: boolean}
        actions: {type: boolean}
      required: [chat, insights, notes, finance, rag, actions]
    AiPreferencesRequest:
      type: object
      additionalProperties: false
      properties:
        taskCalendar: {type: boolean}
        habit: {type: boolean}
        goal: {type: boolean}
        notes: {type: boolean}
        finance: {type: boolean}
        providerTermsAccepted: {type: boolean}
      required: [taskCalendar, habit, goal, notes, finance, providerTermsAccepted]
    AiPreferencesResponse:
      type: object
      properties:
        taskCalendar: {type: boolean}
        habit: {type: boolean}
        goal: {type: boolean}
        notes: {type: boolean}
        finance: {type: boolean}
        policyVersion: {type: string}
        providerNoticeVersion: {type: string}
        providerTermsAcceptedAt: {type: [string, "null"], format: date-time}
        updatedAt: {type: [string, "null"], format: date-time}
        features: {$ref: "#/components/schemas/AiFeatureFlags"}
      required: [taskCalendar, habit, goal, notes, finance, policyVersion, providerNoticeVersion, providerTermsAcceptedAt, updatedAt, features]
    AiConversationCreateRequest:
      type: object
      additionalProperties: false
      properties:
        title: {type: [string, "null"], maxLength: 120}
      required: [title]
    AiConversationResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        title: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
      required: [id, title, createdAt, updatedAt, expiresAt]
    AiConversationPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AiConversationResponse"}
        nextCursor: {type: [string, "null"]}
        hasMore: {type: boolean}
      required: [items, nextCursor, hasMore]
    AiMessageResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        role: {$ref: "#/components/schemas/AiMessageRole"}
        content: {type: string, maxLength: 16000}
        mode: {$ref: "#/components/schemas/AiGenerationMode"}
        contextAvailable: {type: boolean}
        createdAt: {type: string, format: date-time}
      required: [id, role, content, mode, contextAvailable, createdAt]
    AiMessagePage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AiMessageResponse"}
        nextCursor: {type: [string, "null"]}
        hasMore: {type: boolean}
      required: [items, nextCursor, hasMore]
    AiConversationDetailResponse:
      type: object
      properties:
        conversation: {$ref: "#/components/schemas/AiConversationResponse"}
        messages: {$ref: "#/components/schemas/AiMessagePage"}
      required: [conversation, messages]
    AiChatRequest:
      type: object
      additionalProperties: false
      properties:
        message: {type: string, minLength: 1, maxLength: 8000}
        mode: {$ref: "#/components/schemas/AiGenerationMode"}
        contextDomains:
          type: array
          uniqueItems: true
          maxItems: 5
          items: {$ref: "#/components/schemas/AiContextDomain"}
      required: [message, mode, contextDomains]
    AiChatResponse:
      type: object
      properties:
        conversationId: {type: string, format: uuid}
        userMessage: {$ref: "#/components/schemas/AiMessageResponse"}
        assistantMessage: {$ref: "#/components/schemas/AiMessageResponse"}
        actionProposals:
          type: array
          items: {$ref: "#/components/schemas/AiActionProposalResponse"}
      required: [conversationId, userMessage, assistantMessage, actionProposals]
    AiContextEntity:
      type: object
      properties:
        domain: {$ref: "#/components/schemas/AiContextDomain"}
        entityType: {type: string}
        entityId: {type: string, format: uuid}
        entityVersion: {type: [integer, "null"], format: int64}
        fields:
          type: object
          additionalProperties: {}
      required: [domain, entityType, entityId, entityVersion, fields]
    AiContextResponse:
      type: object
      properties:
        messageId: {type: string, format: uuid}
        capturedAt: {type: string, format: date-time}
        domains:
          type: array
          uniqueItems: true
          items: {$ref: "#/components/schemas/AiContextDomain"}
        entities:
          type: array
          maxItems: 200
          items: {$ref: "#/components/schemas/AiContextEntity"}
        truncated: {type: boolean}
      required: [messageId, capturedAt, domains, entities, truncated]
    AiPlanRequest:
      type: object
      additionalProperties: false
      properties:
        periodStart: {type: string, format: date}
        contextDomains:
          type: array
          uniqueItems: true
          maxItems: 3
          items: {$ref: "#/components/schemas/AiContextDomain"}
      required: [periodStart, contextDomains]
    AiSourceReference:
      type: object
      properties:
        domain: {$ref: "#/components/schemas/AiContextDomain"}
        entityType: {type: string}
        entityId: {type: string, format: uuid}
      required: [domain, entityType, entityId]
    AiPlanItem:
      type: object
      properties:
        title: {type: string, maxLength: 200}
        reason: {type: string, maxLength: 1000}
        priority: {type: string, enum: [LOW, MEDIUM, HIGH]}
        suggestedStartAt: {type: [string, "null"], format: date-time}
        suggestedEndAt: {type: [string, "null"], format: date-time}
        sourceRefs:
          type: array
          items: {$ref: "#/components/schemas/AiSourceReference"}
      required: [title, reason, priority, suggestedStartAt, suggestedEndAt, sourceRefs]
    AiPlanResponse:
      type: object
      properties:
        periodType: {type: string, enum: [DAY, WEEK]}
        periodStart: {type: string, format: date}
        summary: {type: string, maxLength: 2000}
        items:
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/AiPlanItem"}
        contextMessageId: {type: string, format: uuid}
      required: [periodType, periodStart, summary, items, contextMessageId]
    AiTaskBreakdownRequest:
      type: object
      additionalProperties: false
      properties:
        instruction: {type: [string, "null"], maxLength: 1000}
        contextDomains:
          type: array
          uniqueItems: true
          maxItems: 3
          items: {$ref: "#/components/schemas/AiContextDomain"}
      required: [instruction, contextDomains]
    AiTaskDraft:
      type: object
      properties:
        title: {type: string, maxLength: 200}
        description: {type: [string, "null"], maxLength: 2000}
        priority: {type: string, enum: [LOW, MEDIUM, HIGH]}
        suggestedDueDate: {type: [string, "null"], format: date}
        reason: {type: string, maxLength: 1000}
      required: [title, description, priority, suggestedDueDate, reason]
    AiTaskBreakdownResponse:
      type: object
      properties:
        sourceTaskId: {type: string, format: uuid}
        items:
          type: array
          minItems: 1
          maxItems: 10
          items: {$ref: "#/components/schemas/AiTaskDraft"}
        contextMessageId: {type: string, format: uuid}
      required: [sourceTaskId, items, contextMessageId]
    AiInsightRequest:
      type: object
      additionalProperties: false
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        contextDomains:
          type: array
          uniqueItems: true
          items: {$ref: "#/components/schemas/AiContextDomain"}
      required: [from, to, contextDomains]
    AiFinanceInsightRequest:
      type: object
      additionalProperties: false
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        contextDomains:
          type: array
          uniqueItems: true
          items: {$ref: "#/components/schemas/AiContextDomain"}
      required: [from, to, currency, contextDomains]
    AiObservation:
      type: object
      properties:
        title: {type: string, maxLength: 200}
        detail: {type: string, maxLength: 2000}
        trend: {type: string, enum: [UP, DOWN, STABLE, MIXED, UNKNOWN]}
        sourceRefs:
          type: array
          items: {$ref: "#/components/schemas/AiSourceReference"}
      required: [title, detail, trend, sourceRefs]
    AiInsightResponse:
      type: object
      properties:
        summary: {type: string, maxLength: 2000}
        observations:
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/AiObservation"}
        contextMessageId: {type: string, format: uuid}
      required: [summary, observations, contextMessageId]
    AiNoteSummaryRequest:
      type: object
      additionalProperties: false
      properties:
        style: {type: string, enum: [BRIEF, BULLETS, DETAILED]}
        contextDomains:
          type: array
          uniqueItems: true
          items: {$ref: "#/components/schemas/AiContextDomain"}
      required: [style, contextDomains]
    AiNoteSummaryResponse:
      type: object
      properties:
        noteId: {type: string, format: uuid}
        summary: {type: string, maxLength: 8000}
        keyPoints:
          type: array
          maxItems: 20
          items: {type: string, maxLength: 500}
        contextMessageId: {type: string, format: uuid}
      required: [noteId, summary, keyPoints, contextMessageId]
    AiProposedChange:
      type: object
      properties:
        field: {type: string}
        before: {}
        after: {}
      required: [field, before, after]
    AiActionProposalResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        conversationId: {type: string, format: uuid}
        sourceMessageId: {type: string, format: uuid}
        actionType: {$ref: "#/components/schemas/AiActionType"}
        status: {$ref: "#/components/schemas/AiActionStatus"}
        version: {type: integer, format: int64, minimum: 1}
        payloadHash: {type: string, pattern: "^[a-f0-9]{64}$"}
        title: {type: string, maxLength: 200}
        changes:
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/AiProposedChange"}
        expiresAt: {type: string, format: date-time}
        result:
          type: [object, "null"]
          additionalProperties: {}
        failureCode: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      required: [id, conversationId, sourceMessageId, actionType, status, version, payloadHash, title, changes, expiresAt, result, failureCode, createdAt, updatedAt]
    AiActionProposalPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AiActionProposalResponse"}
        nextCursor: {type: [string, "null"]}
        hasMore: {type: boolean}
      required: [items, nextCursor, hasMore]
    AiActionApprovalRequest:
      type: object
      additionalProperties: false
      properties:
        version: {type: integer, format: int64, minimum: 1}
        payloadHash: {type: string, pattern: "^[a-f0-9]{64}$"}
