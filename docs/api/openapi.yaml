        requests: {type: integer, format: int64, minimum: 0}
        inputTokens: {type: integer, format: int64, minimum: 0}
        outputTokens: {type: integer, format: int64, minimum: 0}
        estimatedCostMicrousd: {type: integer, format: int64, minimum: 0}
      required: [date, requests, inputTokens, outputTokens, estimatedCostMicrousd]
    AiUsageTotals:
      type: object
      properties:
        requests: {type: integer, format: int64, minimum: 0}
        inputTokens: {type: integer, format: int64, minimum: 0}
        outputTokens: {type: integer, format: int64, minimum: 0}
        estimatedCostMicrousd: {type: integer, format: int64, minimum: 0}
      required: [requests, inputTokens, outputTokens, estimatedCostMicrousd]
    AiUsageResponse:
      type: object
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        days:
          type: array
          items: {$ref: "#/components/schemas/AiUsageDay"}
        totals: {$ref: "#/components/schemas/AiUsageTotals"}
      required: [from, to, days, totals]
    AiQuotaWindow:
      type: object
