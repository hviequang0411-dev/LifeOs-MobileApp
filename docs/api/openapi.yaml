        monthly: {$ref: "#/components/schemas/AiQuotaWindow"}
        rateLimitPerMinute: {type: integer, minimum: 0}
        maxConcurrentPerUser: {type: integer, minimum: 0}
      required: [enabled, budgetAvailable, daily, monthly, rateLimitPerMinute, maxConcurrentPerUser]
    # END AIP1 CONTRACT-FIRST AI SCHEMAS
    AccountDeletionRequest:
