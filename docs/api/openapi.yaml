openapi: 3.1.0
info:
  title: LifeOS API
  version: v1
servers:
- url: /
security:
- bearerAuth: []
paths:
  # BEGIN AIP1 CONTRACT-FIRST AI PATHS
  /api/v1/ai/preferences:
    get:
      operationId: aiGetPreferences
      tags: [ai-controller]
      responses:
        "200":
          description: Tùy chọn consent và feature khả dụng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiPreferencesResponse"}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
    put:
      operationId: aiReplacePreferences
      tags: [ai-controller]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AiPreferencesRequest"}
      responses:
        "200":
          description: Đã thay toàn bộ consent
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiPreferencesResponse"}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /api/v1/ai/conversations:
    post:
      operationId: aiCreateConversation
      tags: [ai-controller]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AiConversationCreateRequest"}
      responses:
        "201":
          description: Đã tạo hội thoại
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiConversationResponse"}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
    get:
      operationId: aiListConversations
      tags: [ai-controller]
      parameters:
      - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      - {in: query, name: cursor, required: false, schema: {type: string}}
      responses:
        "200":
          description: Trang hội thoại theo con trỏ
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiConversationPage"}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /api/v1/ai/conversations/{id}:
    get:
      operationId: aiGetConversation
      tags: [ai-controller]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      - {in: query, name: cursor, required: false, schema: {type: string}}
      responses:
        "200":
          description: Hội thoại và trang message
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiConversationDetailResponse"}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
    delete:
      operationId: aiDeleteConversation
      tags: [ai-controller]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Đã xóa hội thoại và dữ liệu con}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /api/v1/ai/conversations/{id}/messages:
    post:
      operationId: aiCreateMessage
      tags: [ai-controller]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AiChatRequest"}
      responses:
        "201":
          description: Đã tạo message người dùng và phản hồi assistant
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiChatResponse"}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /api/v1/ai/messages/{id}/context:
    get:
      operationId: aiGetMessageContext
      tags: [ai-controller]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Bản context chính xác đã gửi provider sau redaction
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiContextResponse"}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /api/v1/ai/data:
    delete:
      operationId: aiDeleteAllData
      tags: [ai-controller]
      responses:
        "204": {description: Đã xóa dữ liệu AI và reset consent về tắt}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /api/v1/ai/plans/daily:
    post:
      operationId: aiCreateDailyPlan
      tags: [ai-controller]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AiPlanRequest"}
      responses:
        "200":
          description: Kế hoạch ngày chỉ đọc
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiPlanResponse"}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /api/v1/ai/plans/weekly:
    post:
      operationId: aiCreateWeeklyPlan
      tags: [ai-controller]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AiPlanRequest"}
      responses:
        "200":
          description: Kế hoạch tuần chỉ đọc
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiPlanResponse"}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /api/v1/ai/tasks/{id}/breakdown:
    post:
      operationId: aiBreakDownTask
      tags: [ai-controller]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AiTaskBreakdownRequest"}
      responses:
        "200":
          description: Danh sách Task độc lập được đề xuất, chưa ghi dữ liệu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiTaskBreakdownResponse"}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /api/v1/ai/insights/habits:
    post:
      operationId: aiCreateHabitInsight
      tags: [ai-controller]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AiInsightRequest"}
      responses:
        "200":
          description: Insight Habit chỉ đọc
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiInsightResponse"}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /api/v1/ai/insights/finance:
    post:
      operationId: aiCreateFinanceInsight
      tags: [ai-controller]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AiFinanceInsightRequest"}
      responses:
        "200":
          description: Insight Finance chỉ đọc, cần consent riêng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiInsightResponse"}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /api/v1/ai/notes/{id}/summary:
    post:
      operationId: aiSummarizeNote
      tags: [ai-controller]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AiNoteSummaryRequest"}
      responses:
        "200":
          description: Tóm tắt Note chỉ đọc, cần consent Notes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiNoteSummaryResponse"}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /api/v1/ai/action-proposals:
    get:
      operationId: aiListActionProposals
      tags: [ai-controller]
      parameters:
      - {in: query, name: status, required: false, schema: {$ref: "#/components/schemas/AiActionStatus"}}
      - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      - {in: query, name: cursor, required: false, schema: {type: string}}
      responses:
        "200":
          description: Trang action proposal
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiActionProposalPage"}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /api/v1/ai/action-proposals/{id}:
    get:
      operationId: aiGetActionProposal
      tags: [ai-controller]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Proposal và diff chính xác
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiActionProposalResponse"}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /api/v1/ai/action-proposals/{id}/approve:
    post:
      operationId: aiApproveActionProposal
      tags: [ai-controller]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AiActionApprovalRequest"}
      responses:
        "200":
          description: Kết quả idempotent của lần duyệt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiActionProposalResponse"}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /api/v1/ai/action-proposals/{id}/cancel:
    post:
      operationId: aiCancelActionProposal
      tags: [ai-controller]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AiActionCancelRequest"}
      responses:
        "200":
          description: Proposal đã hủy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiActionProposalResponse"}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /api/v1/ai/usage:
    get:
      operationId: aiGetUsage
      tags: [ai-controller]
      parameters:
      - {in: query, name: from, required: true, schema: {type: string, format: date}}
      - {in: query, name: to, required: true, schema: {type: string, format: date}}
      responses:
        "200":
          description: Usage và chi phí ước tính theo ngày
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiUsageResponse"}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /api/v1/ai/limits:
    get:
      operationId: aiGetLimits
      tags: [ai-controller]
      responses:
        "200":
          description: Quota, reset và trạng thái kill switch
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiLimitsResponse"}
        default:
          description: Lỗi AI theo RFC 9457
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  # END AIP1 CONTRACT-FIRST AI PATHS
  /api/v1/account/deletion:
    delete:
      operationId: accountCancel
      responses:
        "204":
          description: Đã hủy yêu cầu xóa
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Lỗi theo RFC 9457 (errorCode ổn định, API_CONVENTIONS §5)"
      tags:
      - account-controller
    get:
      operationId: accountDeletionStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Lỗi theo RFC 9457 (errorCode ổn định, API_CONVENTIONS §5)"
      tags:
      - account-controller
    post:
      operationId: accountSchedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Lỗi theo RFC 9457 (errorCode ổn định, API_CONVENTIONS §5)"
      tags:
      - account-controller
  /api/v1/account/deletion/code:
    post:
      operationId: accountDeletionCode
      responses:
        "202":
          description: Đã gửi mã xác nhận qua email
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Lỗi theo RFC 9457 (errorCode ổn định, API_CONVENTIONS §5)"
      tags:
      - account-controller
  /api/v1/account/export:
    post:
      operationId: accountExport
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResponse"
          description: Đang có yêu cầu chờ/chạy (trả yêu cầu đó)
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResponse"
          description: Đã nhận yêu cầu
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Lỗi theo RFC 9457 (errorCode ổn định, API_CONVENTIONS §5)"
      tags:
      - account-controller
  /api/v1/account/export/{id}:
    get:
      operationId: accountExportStatus
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Lỗi theo RFC 9457 (errorCode ổn định, API_CONVENTIONS §5)"
      tags:
      - account-controller
  /api/v1/account/export/{id}/download:
    get:
      operationId: accountDownload
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/zip: {}
          description: Tệp zip
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Lỗi theo RFC 9457 (errorCode ổn định, API_CONVENTIONS §5)"
      tags:
      - account-controller
  /api/v1/analytics/finance:
    get:
      operationId: analyticsFinance
      parameters:
      - in: query
        name: from
        required: false
        schema:
          type: string
      - in: query
        name: to
        required: false
        schema:
          type: string
      - in: query
        name: granularity
        required: false
        schema:
          type: string
      - in: query
        name: currency
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceAnalytics"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Lỗi theo RFC 9457 (errorCode ổn định, API_CONVENTIONS §5)"
      tags:
      - analytics-controller
  /api/v1/analytics/goals:
    get:
      operationId: analyticsGoals
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalAnalytics"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Lỗi theo RFC 9457 (errorCode ổn định, API_CONVENTIONS §5)"
      tags:
      - analytics-controller
  /api/v1/analytics/habits:
    get:
      operationId: analyticsHabits
      parameters:
      - in: query
        name: from
        required: false
        schema:
          type: string
      - in: query
        name: to
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitAnalytics"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Lỗi theo RFC 9457 (errorCode ổn định, API_CONVENTIONS §5)"
      tags:
      - analytics-controller
  /api/v1/analytics/tasks:
    get:
      operationId: analyticsTasks
      parameters:
      - in: query
        name: from
        required: false
        schema:
          type: string
      - in: query
        name: to
        required: false
        schema:
          type: string
      - in: query
        name: granularity
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAnalytics"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Lỗi theo RFC 9457 (errorCode ổn định, API_CONVENTIONS §5)"
      tags:
      - analytics-controller
  /api/v1/analytics/time:
    get:
      operationId: analyticsTime
      parameters:
      - in: query
        name: from
        required: false
        schema:
          type: string
      - in: query
        name: to
        required: false
        schema:
          type: string
      - in: query
        name: granularity
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeAnalytics"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Lỗi theo RFC 9457 (errorCode ổn định, API_CONVENTIONS §5)"
      tags:
      - analytics-controller
  /api/v1/auth/forgot-password:
    post:
      operationId: authForgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
        required: true
      responses:
        "202":
          description: Đã nhận (luôn như nhau)
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Lỗi theo RFC 9457 (errorCode ổn định, API_CONVENTIONS §5)"
      security: []
      tags:
      - auth-controller
  /api/v1/auth/login:
    post:
      operationId: authLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Lỗi theo RFC 9457 (errorCode ổn định, API_CONVENTIONS §5)"
      security: []
      tags:
      - auth-controller
  /api/v1/auth/logout:
    post:
      operationId: authLogout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "204":
          description: Đã đăng xuất (luôn như nhau)
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Lỗi theo RFC 9457 (errorCode ổn định, API_CONVENTIONS §5)"
      security: []
      tags:
      - auth-controller
  /api/v1/auth/refresh:
    post:
      operationId: authRefresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Lỗi theo RFC 9457 (errorCode ổn định, API_CONVENTIONS §5)"
      security: []
      tags:
      - auth-controller
  /api/v1/auth/register:
    post:
      operationId: authRegister
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "202":
          description: Đã nhận (luôn như nhau dù email đã tồn tại)
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Lỗi theo RFC 9457 (errorCode ổn định, API_CONVENTIONS §5)"
      security: []
      tags:
      - auth-controller
  /api/v1/auth/resend-verification:
    post:
      operationId: authResendVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
        required: true
      responses:
        "202":
          description: Đã nhận (luôn như nhau)
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Lỗi theo RFC 9457 (errorCode ổn định, API_CONVENTIONS §5)"
      security: []
      tags:
      - auth-controller
  /api/v1/auth/reset-password:
    post:
      operationId: authResetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
