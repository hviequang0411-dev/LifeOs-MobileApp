spring:
  application:
    name: lifeos-backend
  # Scheduler nhiều luồng (WP8): job dài (xuất dữ liệu, retention, xóa tài khoản) không được chặn outbox worker (~2 s)
  # và reminder (30 s). Mỗi job vẫn không chạy chồng chính nó (fixedDelay/cron của Spring), job ghi dùng SKIP LOCKED.
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: lifeos-scheduling-
  datasource:
    # Không có giá trị mặc định: thiếu biến môi trường thì app không khởi động (fail fast). Profile dev có mặc định.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        # D87: lock_timeout ở mức kết nối, áp dụng thống nhất cho REST, sync (và Flyway lúc khởi động). Hết hạn →
        # SQLSTATE 55P03 → 503 + Retry-After (GlobalExceptionHandler, SyncPushService).
        options: "-c lock_timeout=${lifeos.db.lock-timeout}"
  # Email (Giai đoạn 4): secret SMTP chỉ từ biến môi trường (SECURITY_RULES §12). SMTP_HOST không có mặc định: thiếu
  # thì app không khởi động. Thời gian chờ giới hạn để một lần gửi không giữ worker outbox quá lâu.
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema chỉ thay đổi qua Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  shutdown: graceful
  # IP thật lấy từ X-Forwarded-For CHỈ khi kết nối đến từ reverse proxy tin cậy (SECURITY_RULES §6).
  # TRUSTED_PROXIES là regex địa chỉ IP của proxy; mặc định rỗng = không tin X-Forwarded-For.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${TRUSTED_PROXIES:}
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    # Hibernate ghi lỗi SQL ở mức WARN kèm "Detail" của PostgreSQL, có thể chứa giá trị dữ liệu người dùng (vd email
    # khi vi phạm ux_users_email_lower lúc hai đăng ký đồng thời — D76). Log chỉ được chứa userId, không PII khác
    # (CODE_GUIDELINES §14). Lỗi thật vẫn được log qua GlobalExceptionHandler (không kèm giá trị dữ liệu).
    org.hibernate.orm.jdbc.error: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # Email đi bất đồng bộ qua outbox (§3.11): SMTP tạm hỏng không được làm app "không sẵn sàng" và bị rút khỏi
    # vòng phục vụ. Lỗi gửi được theo dõi qua metric lifeos.outbox.events / lifeos.outbox.pending [PROPOSED].
    mail:
      enabled: false

# OpenAPI chỉ bật ở profile dev/test (D63).
springdoc:
  api-docs:
    enabled: false
  # Khóa sắp theo thứ tự chữ cái để docs/api/openapi.yaml xuất ra ổn định (diff được trong PR).
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

# Cấu hình ứng dụng (SYSTEM_ARCHITECTURE §3.14). Secret chỉ lấy từ biến môi trường.
lifeos:
  security:
    jwt:
      # Bắt buộc, base64, tối thiểu 32 byte. Thiếu hoặc sai thì app không khởi động.
      secret: ${JWT_SECRET}
      kid: ${JWT_KID:primary}
      # Khóa cũ trong thời gian xoay khóa (SECURITY_RULES §4.1): chỉ dùng để xác thực, không để ký.
      previous-secret: ${JWT_PREVIOUS_SECRET:}
      previous-kid: ${JWT_PREVIOUS_KID:}
      issuer: ${JWT_ISSUER:lifeos-backend}
      audience: ${JWT_AUDIENCE:lifeos-app}
      access-token-ttl: 15m
      clock-skew: 30s
    password:
      # Mức tối thiểu OWASP cho Argon2id; chốt lại bằng benchmark trên máy chủ thật (D46).
      argon2:
        salt-length: 16
        hash-length: 32
        parallelism: 1
        memory-kib: 19456
        iterations: 2
    request:
      max-body-bytes: 1048576   # 1 MB (D55)
  sync:
    pull-page-size: ${SYNC_PULL_PAGE_SIZE:200}
    push-max-batch: ${SYNC_PUSH_MAX_BATCH:50}
    payload-max-bytes: 65536
    # Khóa HMAC ký snapshotToken của full resync (D151; đợt sửa F9) — bắt buộc, ≥ 32 ký tự, khác khóa JWT. Không có
    # mặc định: thiếu thì app không khởi động (profile dev/test có giá trị riêng). Mọi instance dùng chung một giá trị.
    snapshot-hmac-secret: ${SNAPSHOT_HMAC_SECRET}
  db:
    # SYNC_PROTOCOL §5.2, §8 (D87): thời gian chờ khóa tối đa của một câu lệnh.
    lock-timeout: 5s
  # Email (SYSTEM_ARCHITECTURE §3.14): người gửi và gốc liên kết trong email — bắt buộc, không mặc định.
  mail:
    from: ${MAIL_FROM}
    app-base-url: ${APP_BASE_URL}
  # Thông báo (PHASE_4): khóa HMAC liên kết hủy đăng ký email (D143) — bắt buộc, ≥ 32 ký tự, khác khóa JWT; gốc URL
  # API cho liên kết đó (mặc định = APP_BASE_URL). FCM (D137) tắt mặc định; bật bằng FCM_ENABLED=true + thông tin service
  # account qua biến môi trường (SECURITY_RULES §12).
  notification:
    unsubscribe-secret: ${NOTIFICATION_UNSUBSCRIBE_SECRET}
    api-base-url: ${API_BASE_URL:${lifeos.mail.app-base-url}}
  fcm:
    enabled: ${FCM_ENABLED:false}
    project-id: ${FCM_PROJECT_ID:}
    client-email: ${FCM_CLIENT_EMAIL:}
    private-key: ${FCM_PRIVATE_KEY:}
    token-uri: ${FCM_TOKEN_URI:https://oauth2.googleapis.com/token}
    endpoint: ${FCM_ENDPOINT:https://fcm.googleapis.com}
  # Job định kỳ (SYSTEM_ARCHITECTURE §3.12, D28). Test tắt để gọi worker một cách xác định.
  scheduling:
    enabled: true
  ai:
    enabled: ${AI_ENABLED:false}
    budget-available: ${AI_BUDGET_AVAILABLE:true}
    provider: openai
    model: ${OPENAI_MODEL:gpt-6.1-sol}
    openai-api-key: ${OPENAI_API_KEY:}
    features:
      chat: ${AI_CHAT_ENABLED:false}
      insights: ${AI_INSIGHTS_ENABLED:false}
      notes: ${AI_NOTES_ENABLED:false}
      finance: ${AI_FINANCE_ENABLED:false}
      rag: false
      actions: false
  # Outbox worker (§3.11, D23). Chu kỳ ~2s theo tài liệu; các con số khác [PROPOSED] Giai đoạn 4.
  outbox:
    poll-interval: 2s
    batch-size: 10
    lease: 10m
    max-attempts: 8
    backoff-base: 30s
    backoff-max: 1h
  # PHASE_7 (BACKEND_MASTER_PLAN §4 mục 7): cache tổng hợp no-op, ngưỡng AT_RISK, xuất dữ liệu, xóa tài khoản.
  cache:
    enabled: false
  analytics:
    at-risk-threshold: 0.15
  export:
    dir: ${EXPORT_DIR:${java.io.tmpdir}/lifeos-exports}
    max-bytes: 524288000
    poll-interval: 30s
    expire-cron: "0 5 * * * *"
  account:
    deletion-cooldown: 7d
    purge-cron: "0 20 * * * *"
  # Dọn token/outbox hết hạn quá 7 ngày, hằng ngày lúc 03:00 UTC [PROPOSED giờ chạy].
  cleanup:
    cron: "0 0 3 * * *"
